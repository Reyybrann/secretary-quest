<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Periksa Game Secretary Quest v1.5</title><style>body{font-family:system-ui;margin:auto;padding:24px;max-width:680px;background:#eef4ee;color:#123a41}article{background:white;padding:20px;border-radius:14px}li{margin:12px 0}span{font-weight:700}.ok{color:green}.bad{color:#ad2121}button{background:#235a63;color:white;padding:12px;border:0;border-radius:9px}</style></head><body><article><h1>Periksa Instalasi Game v1.5</h1><p>Halaman ini mengecek apakah seluruh file terbaru sudah ada di GitHub Pages.</p><button onclick="location.reload()">Periksa ulang</button><ul id="list"></ul><p id="result">Sedang memeriksa...</p><p>Jika ada file merah, unggah ulang isi ZIP versi 1.5 ke <b>root repository</b> lalu tunggu GitHub Pages selesai membangun.</p><a href="./?versi=150">Kembali ke game</a></article><script>const required=['index.html','style.css','src/main.js','src/office.js','src/touch-controls.js','src/screen-mode.js','src/engine.js','src/data.js','src/art.js','src/world.js','vendor/phaser-3.90.0.min.js'];let passed=0;Promise.all(required.map(async path=>{let ok=false,msg='';try{const r=await fetch(path+'?check='+Date.now(),{cache:'no-store'});const t=await r.text();ok=r.ok&&(path==='index.html'||path==='src/main.js'||path==='src/office.js'||path==='style.css'?t.includes('1.5'):true);msg=r.status+(ok?' OK':' Versi/file salah');}catch(e){msg=e.message;}if(ok)passed++;let li=document.createElement('li');li.textContent=path+' — '+msg;li.className=ok?'ok':'bad';document.getElementById('list').appendChild(li)})).then(()=>{document.getElementById('result').textContent=passed+'/'+required.length+' file benar'+(passed===required.length?' — SIAP DIMAINKAN!':' — Upload belum lengkap!');});</script></body></html>
